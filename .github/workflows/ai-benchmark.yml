# Banc d'essai des modèles d'extraction (docs/ai-model-benchmark.md, architecture §6).
# Lancé à la main (onglet Actions) ou par un push qui modifie le banc, hors main. Un job par modèle, en
# parallèle, sur un runner Ubuntu standard sans GPU (4 vCPU, 16 Go) : la même image Ollama que
# docker-compose.yml, le même prompt et le même schéma que l'application.
# Résultats : résumé du job et annotations (lisibles sans connexion pour un dépôt public).
name: Banc d'essai IA

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Mesures séparées par des espaces : modèle, ou modèle@non pour couper le raisonnement'
        default: 'qwen3.5:4b@non qwen3.5:2b@non gemma3:4b llama3.2:3b'
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/ai-benchmark.yml
      - backend/scripts/ai-benchmark/**
      - backend/src/main/resources/prompts/**

permissions:
  contents: read

concurrency:
  group: ai-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_VERSION: 0.40.14

jobs:
  plan:
    name: Liste des mesures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # « modèle » : appelé comme dans l'application (raisonnement au choix du modèle) ;
      # « modèle@non » : raisonnement coupé (think=false), pour les modèles qui raisonnent (qwen3.5).
      # Première série (4 novembre 2026) : qwen3.5:4b qwen3.5:4b@non qwen3.5:9b qwen3.5:9b@non llama3.2:3b
      - id: plan
        env:
          MODELS: ${{ inputs.models || 'qwen3.5:4b@non qwen3.5:2b@non gemma3:4b llama3.2:3b' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          runs = [dict(zip(("model", "think"), (m.split("@") + [""])[:2])) for m in os.environ["MODELS"].split()]
          print("matrix=" + json.dumps({"include": runs}))
          EOF

  benchmark:
    name: ${{ matrix.model }}${{ matrix.think && ' (think=non)' || '' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Image Ollama (plusieurs Go) et modèle 9B ne tiennent pas dans l'espace libre par défaut
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Démarrer Ollama ${{ env.OLLAMA_VERSION }}
        run: |
          docker run -d --name ollama -p 11434:11434 "ollama/ollama:$OLLAMA_VERSION"
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 2; done

      - name: Télécharger ${{ matrix.model }}
        run: |
          for i in 1 2 3; do docker exec ollama ollama pull "${{ matrix.model }}" > /dev/null && break; sleep 10; done
          docker exec ollama ollama list

      - name: Mesurer sur les 10 CV
        env:
          PYTHONIOENCODING: utf-8
        run: |
          think=()
          [ -n "${{ matrix.think }}" ] && think=(--think "${{ matrix.think }}")
          python3 -I -u backend/scripts/ai-benchmark/run_benchmark.py "${{ matrix.model }}" \
            --out results.md "${think[@]}" | tee log.txt

      - name: Publier les résultats
        if: always()
        run: |
          cpu=$(lscpu | sed -n 's/^Model name: *//p'); mem=$(free -g | awk '/Mem:/ {print $2}')
          machine="$cpu, $(nproc) vCPU, $mem Go, sans GPU, Ollama $OLLAMA_VERSION"
          row=$(tail -1 results.md 2>/dev/null || echo "pas de résultat")
          # Une annotation n'accepte qu'une ligne : les retours à la ligne sont encodés en %0A
          detail=$(grep -E ' : |prompt ' log.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Résultat ${{ matrix.model }} ${{ matrix.think }}::$row%0A$machine"
          echo "::notice title=Détail ${{ matrix.model }} ${{ matrix.think }}::$detail"
          {
            echo "### ${{ matrix.model }} ${{ matrix.think && '(think=non)' || '' }}"
            echo "$machine"; echo
            head -2 results.md 2>/dev/null; echo "$row"; echo
            echo '```'; cat log.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
