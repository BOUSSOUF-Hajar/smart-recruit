# Intégration et livraison continues (US-05, complétée en phase 11 par US-55 et US-57).
# Chaque pull request : compilation, tests unitaires et d'intégration, couverture (seuil 70 % sur les
# services), analyse statique, dépendances vulnérables et secrets, tests de bout en bout.
# Chaque fusion sur main : en plus, construction, analyse et publication des images Docker.
# Une étape rouge rend la pull request non fusionnable (règle de protection de main, à activer une fois).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution en cours, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, couverture, SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests unitaires (*Test) puis d'intégration (*IT, Testcontainers : Docker est disponible sur les
      # runners Ubuntu), fusion des couvertures et contrôle du seuil de 70 % (jacoco:check).
      # Le wrapper impose la même version de Maven (3.9.14) que sur les postes de développement.
      - name: Compiler, tester, mesurer la couverture
        run: ./mvnw -B -ntp verify

      - name: Analyse statique (SpotBugs)
        run: ./mvnw -B -ntp spotbugs:check

      - name: Résumé de la couverture
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 && ($2 ~ /\.application$/ || $2 ~ /\.domain$/) { missed += $8; covered += $9 }
                   END { if (missed + covered > 0)
                           printf "### Couverture des services et règles métier : %.1f %% des lignes (seuil 70 %%)\n",
                                  100 * covered / (missed + covered) }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/spotbugsXml.xml
          retention-days: 7

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (ESLint, frontières entre dossiers)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires (Vitest)
        run: npm run test:ci

      - name: Typage des tests de bout en bout
        run: npm run e2e:typecheck

      - name: Build de production
        run: npm run build

      # Dépendances livrées au navigateur seulement : les outils de build ne partent pas en production
      - name: Dépendances vulnérables (npm audit)
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Dépendances et secrets (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ENF-SEC-11 et ENF-SEC-12 : vulnérabilités connues des dépendances (pom.xml, package-lock.json)
      # et secrets commités ; échec sur une vulnérabilité HIGH ou CRITICAL qui a un correctif
      - name: Analyse du dépôt
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: frontend/node_modules,backend/target

  e2e:
    name: Bout en bout (Playwright sur docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # L'application exactement comme un visiteur la lance (US-54), sans l'IA : le modèle pèse 6 Go
      - name: Démarrer l'application (profil demo)
        run: |
          cp .env.example .env
          sed -i 's/^AI_ENABLED=.*/AI_ENABLED=false/' .env
          docker compose up -d --build --wait --wait-timeout 300 postgres backend frontend

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e

      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7

      - name: Arrêter l'application
        if: always()
        run: docker compose down -v

  images:
    name: Images Docker (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, security, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # Construite et chargée localement d'abord, pour être analysée avant toute publication
      - name: Construire
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          load: true
          tags: smartrecruit-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Analyser l'image (vulnérabilités critiques corrigeables)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartrecruit-${{ matrix.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Publier
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
