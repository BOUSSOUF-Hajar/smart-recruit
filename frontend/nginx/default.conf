# Frontend SmartRecruit (US-54) : fichiers statiques d'Angular et proxy vers l'API, sur la même origine.
# Même origine : pas de CORS, et le cookie de session (SameSite=Strict, chemin /api/v1/auth) suit.
server {
    listen 8080;                      # image non privilégiée : pas de port < 1024
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # CV de 5 Mo au plus (RG-07) + en-têtes multipart ; au-delà, refus avant d'atteindre le backend
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ^~ : tout /api/ va au backend, même un chemin en .js, .css ou .png (Swagger UI sous /api/docs,
    # US-58) ; sans lui, la location des fichiers statiques ci-dessous, en expression régulière,
    # l'emporterait et chercherait le fichier sur le disque.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 130s;      # au-delà du délai de l'IA (120 s) ; les analyses sont de toute façon asynchrones
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Sonde du health check du conteneur ; ne dépend pas du backend
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers nommés avec une empreinte (outputHashing) : cache d'un an
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Routes Angular (/recruiter/applications/…) : retour à index.html, jamais mis en cache
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
