# En-têtes de sécurité (ENF-SEC-08), inclus dans chaque location : un add_header dans une location
# remplace ceux du niveau server, d'où ce fichier commun.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Scripts : uniquement ceux de l'application (aucun script en ligne, inlineCritical désactivé au build).
# Styles : Angular injecte les styles des composants dans des balises <style>, d'où 'unsafe-inline'.
# Polices et icônes hébergées avec l'application : aucune requête vers un domaine tiers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# HSTS seulement derrière HTTPS (un navigateur l'ignore en HTTP) : à activer là où TLS est terminé.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
